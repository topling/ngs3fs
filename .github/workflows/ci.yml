name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out ngs3fs
        uses: actions/checkout@v7

      - name: Check out libfuse test cases
        uses: actions/checkout@v7
        with:
          repository: libfuse/libfuse
          ref: 3b25c1d39620b4b0f445c3e3b042edc4a6e4c6b3
          path: upstream/libfuse

      - name: Check out Linux kernel filesystem tests
        run: |
          mkdir -p upstream/xfstests
          git -C upstream/xfstests init
          git -C upstream/xfstests remote add origin \
            https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git
          git -C upstream/xfstests fetch --depth 1 origin \
            56c410ad0f69da5b13c5807bc47b4876dcfa02b2
          git -C upstream/xfstests checkout --detach FETCH_HEAD
          test "$(git -C upstream/xfstests rev-parse HEAD)" = \
            56c410ad0f69da5b13c5807bc47b4876dcfa02b2
          git -C upstream/xfstests apply \
            "$GITHUB_WORKSPACE/scripts/xfstests-fuse-subtype.patch"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            acl \
            attr \
            automake \
            bc \
            cmake \
            curl \
            fuse3 \
            gawk \
            kmod \
            libacl1-dev \
            libaio-dev \
            libcap-dev \
            libfuse3-dev \
            libgdbm-compat-dev \
            libgdbm-dev \
            libtool \
            libtool-bin \
            liburing-dev \
            libssl-dev \
            meson \
            ninja-build \
            psmisc \
            python3 \
            strace \
            uuid-dev \
            xfslibs-dev \
            xfsprogs \
            xz-utils

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          sudo chmod a+rw /dev/fuse

      - name: Bootstrap, build, and test
        run: ./scripts/bootstrap.sh

      - name: Verify local-cache page advice
        run: |
          trace=build/cache-noreuse.trace
          strace -f -e trace=fadvise64 -o "$trace" build/dev/cache_test
          total=$(grep -c 'fadvise64(' "$trace")
          advised=$(grep -c \
            'fadvise64([^,]*, 0, 0, POSIX_FADV_NOREUSE)' "$trace")
          test "$total" -gt 0
          test "$total" -eq "$advised"

      - name: Build Linux kernel filesystem tests
        run: make -C upstream/xfstests -j2

      - name: Verify automatic topling-zip clone
        run: |
          source_dir=build/dev/_deps/ngs3fs_topling_zip-src
          test -f "${source_dir}/src/terark/sso.hpp"
          test -f "${source_dir}/src/terark/gold_hash_map.hpp"
          test -f "${source_dir}/src/terark/hash_common.cpp"
          test -f "${source_dir}/boost-include/boost/current_function.hpp"

      - name: Download VersityGW
        run: |
          archive=build/e2e/versitygw/versitygw_v1.7.0_Linux_x86_64.tar.gz
          mkdir -p "$(dirname "$archive")"
          curl --fail --location \
            https://github.com/versity/versitygw/releases/download/v1.7.0/versitygw_v1.7.0_Linux_x86_64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            dacec530fecaa8776feec0536998dd4bd78036e0d4db0da9b9189d96bb790e03 \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C build/e2e/versitygw

      - name: Run libfuse functional and stress cases against ngs3fs
        env:
          NGS3FS_STRESS_JOBS: 8
          NGS3FS_STRESS_ITERATIONS: 20
        run: |
          ./scripts/test_libfuse_cases.sh \
            "$GITHUB_WORKSPACE/upstream/libfuse" \
            "$GITHUB_WORKSPACE/build/libfuse-cases"

      - name: Run filtered xfstests correctness and stress cases
        env:
          NGS3FS_XFSTESTS_STRESS_JOBS: 8
          NGS3FS_XFSTESTS_STRESS_OPERATIONS: 500
          NGS3FS_RANDOM_READ_FILES: 32
          NGS3FS_RANDOM_READ_THREADS: 16
          NGS3FS_RANDOM_READ_OPERATIONS: 128
          NGS3FS_RANDOM_READ_FILE_SIZE: 4194304
          NGS3FS_RANDOM_READ_MAXIMUM: 262144
        run: |
          sudo env \
            NGS3FS_XFSTESTS_STRESS_JOBS="$NGS3FS_XFSTESTS_STRESS_JOBS" \
            NGS3FS_XFSTESTS_STRESS_OPERATIONS="$NGS3FS_XFSTESTS_STRESS_OPERATIONS" \
            NGS3FS_RANDOM_READ_FILES="$NGS3FS_RANDOM_READ_FILES" \
            NGS3FS_RANDOM_READ_THREADS="$NGS3FS_RANDOM_READ_THREADS" \
            NGS3FS_RANDOM_READ_OPERATIONS="$NGS3FS_RANDOM_READ_OPERATIONS" \
            NGS3FS_RANDOM_READ_FILE_SIZE="$NGS3FS_RANDOM_READ_FILE_SIZE" \
            NGS3FS_RANDOM_READ_MAXIMUM="$NGS3FS_RANDOM_READ_MAXIMUM" \
            ./scripts/test_xfstests.sh \
            "$GITHUB_WORKSPACE/upstream/xfstests" \
            "$GITHUB_WORKSPACE/build/xfstests"

      - name: Run multi-mount race and large-directory test
        env:
          NGS3FS_LARGE_DIRECTORY_ENTRIES: 5000
        run: |
          ./scripts/test_multi_mount.sh \
            "$GITHUB_WORKSPACE/build/multi-mount"

  hardening:
    name: hardening (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            runner: ubuntu-24.04
            preset: asan
          - name: tsan
            runner: ubuntu-24.04
            preset: tsan
          - name: clang
            runner: ubuntu-24.04
            preset: clang
          - name: arm64
            runner: ubuntu-24.04-arm
            preset: dev
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out ngs3fs
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            fuse3 \
            libfuse3-dev \
            liburing-dev \
            libssl-dev \
            meson \
            ninja-build

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          sudo chmod a+rw /dev/fuse

      - name: Build and test
        env:
          NGS3FS_PRESET: ${{ matrix.preset }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: ./scripts/bootstrap.sh

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out ngs3fs
        uses: actions/checkout@v7

      - name: Check out goofys
        uses: actions/checkout@v7
        with:
          repository: kahing/goofys
          ref: 350ff312abaa1abcf21c5a06e143c7edffe9e2f4
          path: upstream/goofys

      - name: Check out Mountpoint for Amazon S3
        uses: actions/checkout@v7
        with:
          repository: awslabs/mountpoint-s3
          ref: 70bd7b627969ed6decdeab91a6a445a2347d827c
          path: upstream/mountpoint-s3
          submodules: recursive

      - name: Check out FlameGraph
        uses: actions/checkout@v7
        with:
          repository: brendangregg/FlameGraph
          ref: 41fee1f99f9276008b7cd112fca19dc3ea84ac32
          path: build/tools/FlameGraph

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            curl \
            fuse3 \
            libfuse3-dev \
            liburing-dev \
            libssl-dev \
            linux-tools-common \
            linux-tools-generic \
            meson \
            ninja-build \
            python3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          sudo chmod a+rw /dev/fuse

      - name: Build ngs3fs, goofys, and Mountpoint
        run: |
          ./scripts/bootstrap.sh
          mkdir -p build/tools
          cd upstream/goofys
          go build \
            -ldflags "-X main.Version=$(git rev-parse HEAD)" \
            -o "$GITHUB_WORKSPACE/build/tools/goofys" .
          cd "$GITHUB_WORKSPACE/upstream/mountpoint-s3"
          rustup toolchain install 1.96 --profile minimal
          cargo +1.96 build --release --locked --bin mount-s3
          cp target/release/mount-s3 \
            "$GITHUB_WORKSPACE/build/tools/mount-s3"

      - name: Download VersityGW
        run: |
          archive=build/e2e/versitygw/versitygw_v1.7.0_Linux_x86_64.tar.gz
          mkdir -p "$(dirname "$archive")"
          curl --fail --location \
            https://github.com/versity/versitygw/releases/download/v1.7.0/versitygw_v1.7.0_Linux_x86_64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            dacec530fecaa8776feec0536998dd4bd78036e0d4db0da9b9189d96bb790e03 \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C build/e2e/versitygw

      - name: Enable perf
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          sudo sysctl -w net.core.rmem_max=16777216
          perf --version

      - name: Compare concurrent random reads
        run: |
          for mode in none cold warm; do
            sudo env \
              GOOFYS_BIN="$GITHUB_WORKSPACE/build/tools/goofys" \
              BENCHMARK_REPETITIONS=4 \
              CACHE_MODE="$mode" \
              DROP_CACHES_AFTER_WARMUP=1 \
              ./scripts/benchmark_random_read.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-random-read-$mode"
          done

      - name: A/B test io engines and reactor counts
        run: |
          sudo env \
            BENCHMARK_REPETITIONS=3 \
            RANDOM_READ_ADVICE=random \
            ./scripts/benchmark_io_engine.sh \
            "$GITHUB_WORKSPACE/build/benchmarks/github-io-engine"
          cat build/benchmarks/github-io-engine/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compare Mountpoint concurrent random reads
        run: |
          for mode in none cold warm; do
            sudo env \
              REFERENCE_CLIENT=mountpoint-s3 \
              MOUNTPOINT_S3_BIN="$GITHUB_WORKSPACE/build/tools/mount-s3" \
              BENCHMARK_REPETITIONS=3 \
              CACHE_MODE="$mode" \
              DROP_CACHES_AFTER_WARMUP=1 \
              ./scripts/benchmark_random_read.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-mountpoint-random-read-$mode"
          done

      - name: A/B test socket receive buffer
        run: |
          sudo env \
            BENCHMARK_REPETITIONS=8 \
            SOCKET_BUFFER_SIZES="0 2MiB" \
            ./scripts/benchmark_socket_buffer.sh \
            "$GITHUB_WORKSPACE/build/benchmarks/github-socket-buffer"

      - name: Profile strict random advice
        if: always()
        run: |
          sudo env \
            WORKLOAD=random-read \
            RANDOM_READ_ADVICE=random \
            CACHE_MODE=warm \
            PERF_BIN="$(command -v perf)" \
            PERF_LIB_DIR= \
            PERF_EVENT=cpu-clock \
            PERF_FREQUENCY=4000 \
            PORT=17650 \
            ./scripts/profile_ngs3fs.sh \
            "$GITHUB_WORKSPACE/build/profiles/github-random-advice"

      - name: Profile normal advice
        if: always()
        run: |
          sudo env \
            WORKLOAD=random-read \
            RANDOM_READ_ADVICE=normal \
            CACHE_MODE=warm \
            PERF_BIN="$(command -v perf)" \
            PERF_LIB_DIR= \
            PERF_EVENT=cpu-clock \
            PERF_FREQUENCY=4000 \
            PORT=17651 \
            ./scripts/profile_ngs3fs.sh \
            "$GITHUB_WORKSPACE/build/profiles/github-normal-advice"

      - name: Profile cached sequential write
        if: always()
        run: |
          sudo env \
            WORKLOAD=write \
            CACHE_MODE=warm \
            WRITE_BYTES=67108864 \
            WRITE_BLOCK_SIZE=262144 \
            PERF_BIN="$(command -v perf)" \
            PERF_LIB_DIR= \
            PERF_EVENT=cpu-clock \
            PERF_FREQUENCY=4000 \
            PORT=17652 \
            ./scripts/profile_ngs3fs.sh \
            "$GITHUB_WORKSPACE/build/profiles/github-cached-write"

      - name: Benchmark multipart crash recovery
        if: always()
        run: |
          sudo env \
            RECOVERY_BYTES=67108864 \
            RECOVERY_BLOCK_SIZE=262144 \
            RECOVERY_TIMEOUT_SECONDS=60 \
            PORT=17653 \
            ./scripts/benchmark_cache_recovery.sh \
            "$GITHUB_WORKSPACE/build/benchmarks/github-cache-recovery"

      - name: Make Mountpoint evidence readable
        if: always()
        run: |
          for log_root in build/benchmarks/github-mountpoint-random-read-*; do
            if [[ -d "$log_root" ]]; then
              sudo find "$log_root" -path '*/mountpoint-logs/*' -type f \
                -exec chmod a+r {} +
            fi
          done

      - name: Summarize random-read CPU comparisons
        if: always()
        run: |
          sudo install -d -o "$USER" -g "$(id -gn)" \
            build/benchmarks/random-read-report
          ./scripts/summarize_random_read.py \
            build/benchmarks/random-read-report \
            build/benchmarks/github-random-read-* \
            build/benchmarks/github-mountpoint-random-read-*
          cat build/benchmarks/random-read-report/random-read-cpu-comparison.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark and flame graphs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: random-read-benchmark-and-flamegraphs
          retention-days: 7
          if-no-files-found: error
          path: |
            build/benchmarks/github-random-read-*/system.txt
            build/benchmarks/github-random-read-*/samples.csv
            build/benchmarks/github-random-read-*/summary.csv
            build/benchmarks/github-random-read-*/*/random-read-summary.csv
            build/benchmarks/github-random-read-*/*/*-random-read-result.txt
            build/benchmarks/github-random-read-*/*/ngs3fs.log
            build/benchmarks/github-random-read-*/*/goofys.log
            build/benchmarks/github-random-read-*/*/versity.log
            build/benchmarks/github-io-engine/system.txt
            build/benchmarks/github-io-engine/samples.csv
            build/benchmarks/github-io-engine/summary.csv
            build/benchmarks/github-io-engine/summary.md
            build/benchmarks/github-io-engine/*/random-read-summary.csv
            build/benchmarks/github-io-engine/*/ngs3fs.log
            build/benchmarks/github-io-engine/*/versity.log
            build/benchmarks/github-mountpoint-random-read-*/system.txt
            build/benchmarks/github-mountpoint-random-read-*/samples.csv
            build/benchmarks/github-mountpoint-random-read-*/summary.csv
            build/benchmarks/github-mountpoint-random-read-*/*/random-read-summary.csv
            build/benchmarks/github-mountpoint-random-read-*/*/*-random-read-result.txt
            build/benchmarks/github-mountpoint-random-read-*/*/ngs3fs.log
            build/benchmarks/github-mountpoint-random-read-*/*/mountpoint-s3.log
            build/benchmarks/github-mountpoint-random-read-*/*/mountpoint-logs/*
            build/benchmarks/github-mountpoint-random-read-*/*/versity.log
            build/benchmarks/random-read-report/**
            build/benchmarks/github-socket-buffer/system.txt
            build/benchmarks/github-socket-buffer/samples.csv
            build/benchmarks/github-socket-buffer/summary.csv
            build/benchmarks/github-socket-buffer/*/random-read-summary.csv
            build/benchmarks/github-socket-buffer/*/*-random-read-result.txt
            build/benchmarks/github-socket-buffer/*/ngs3fs-random-read-requests.log
            build/benchmarks/github-socket-buffer/*/ngs3fs.log
            build/benchmarks/github-socket-buffer/*/versity.log
            build/profiles/github-*-advice/profile-summary.csv
            build/profiles/github-*-advice/random-read.txt
            build/profiles/github-*-advice/ngs3fs.log
            build/profiles/github-*-advice/versity.log
            build/profiles/github-*-advice/perf.folded
            build/profiles/github-*-advice/perf-stat.csv
            build/profiles/github-*-advice/perf-self.txt
            build/profiles/github-*-advice/perf-self-flat.txt
            build/profiles/github-*-advice/perf-inclusive.txt
            build/profiles/github-*-advice/perf-dso.txt
            build/profiles/github-*-advice/ngs3fs-random-read.svg
            build/profiles/github-*-advice/ngs3fs-random-read-interactive.html
            build/profiles/github-cached-write/profile-summary.csv
            build/profiles/github-cached-write/profile-metadata.txt
            build/profiles/github-cached-write/ngs3fs.log
            build/profiles/github-cached-write/versity.log
            build/profiles/github-cached-write/perf.folded
            build/profiles/github-cached-write/perf-stat.csv
            build/profiles/github-cached-write/perf-self.txt
            build/profiles/github-cached-write/perf-self-flat.txt
            build/profiles/github-cached-write/perf-inclusive.txt
            build/profiles/github-cached-write/perf-dso.txt
            build/profiles/github-cached-write/ngs3fs-write.svg
            build/profiles/github-cached-write/ngs3fs-write-interactive.html
            build/benchmarks/github-cache-recovery/summary.csv
            build/benchmarks/github-cache-recovery/ngs3fs-before-crash.log
            build/benchmarks/github-cache-recovery/ngs3fs-recovery.log
            build/benchmarks/github-cache-recovery/versity.log
            build/benchmarks/github-cache-recovery/versity-access.log

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload CPU comparison site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/benchmarks/random-read-report

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: benchmark
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy CPU comparison site
        id: deployment
        uses: actions/deploy-pages@v5
