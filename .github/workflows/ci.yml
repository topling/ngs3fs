name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out ngs3fs
        uses: actions/checkout@v7

      - name: Check out libfuse test cases
        uses: actions/checkout@v7
        with:
          repository: libfuse/libfuse
          ref: 3b25c1d39620b4b0f445c3e3b042edc4a6e4c6b3
          path: upstream/libfuse

      - name: Check out Linux kernel filesystem tests
        run: |
          mkdir -p upstream/xfstests
          git -C upstream/xfstests init
          git -C upstream/xfstests remote add origin \
            https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git
          git -C upstream/xfstests fetch --depth 1 origin \
            56c410ad0f69da5b13c5807bc47b4876dcfa02b2
          git -C upstream/xfstests checkout --detach FETCH_HEAD
          test "$(git -C upstream/xfstests rev-parse HEAD)" = \
            56c410ad0f69da5b13c5807bc47b4876dcfa02b2
          git -C upstream/xfstests apply \
            "$GITHUB_WORKSPACE/scripts/xfstests-fuse-subtype.patch"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            acl \
            attr \
            automake \
            bc \
            cmake \
            curl \
            fuse3 \
            gawk \
            kmod \
            libacl1-dev \
            libaio-dev \
            libcap-dev \
            libfuse3-dev \
            libgdbm-compat-dev \
            libgdbm-dev \
            libtool \
            libtool-bin \
            liburing-dev \
            libssl-dev \
            meson \
            ninja-build \
            psmisc \
            python3 \
            strace \
            uuid-dev \
            xfslibs-dev \
            xfsprogs \
            xz-utils

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          sudo chmod a+rw /dev/fuse

      - name: Bootstrap, build, and test
        run: ./scripts/bootstrap.sh

      - name: Check privileged native passthrough
        run: |
          mkdir -p build/passthrough
          set +e
          sudo ctest --test-dir build/dev --output-on-failure -V \
            -R '^(native_passthrough_real_test|fuse_native_passthrough_wiring_test|fuse_passthrough_budget_fallback_test)$' \
            >build/passthrough/native.log 2>&1
          result=$?
          set -e
          cat build/passthrough/native.log
          test "$result" = 0
          if grep -q 'Skipped' build/passthrough/native.log; then
            echo 'Some native passthrough tests were unavailable on this kernel; see native.log for the explicit reason. Fallback remains covered by CTest.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check whole-block reads with delayed and paced payloads
        run: |
          for reactors in 1 2; do
            NGS3FS_REACTORS="$reactors" ./scripts/check_read_latency.sh \
              "$GITHUB_WORKSPACE/build/read-latency-$reactors"
          done

      - name: Verify local-cache page advice
        run: |
          trace=build/cache-noreuse.trace
          strace -f -e trace=fadvise64 -o "$trace" build/dev/cache_test
          total=$(grep -c 'fadvise64(' "$trace")
          advised=$(grep -c \
            'fadvise64([^,]*, 0, 0, POSIX_FADV_NOREUSE)' "$trace")
          test "$total" -gt 0
          test "$total" -eq "$advised"

      - name: Build Linux kernel filesystem tests
        run: make -C upstream/xfstests -j2

      - name: Verify automatic topling-zip clone
        run: |
          source_dir=build/dev/_deps/ngs3fs_topling_zip-src
          test -f "${source_dir}/src/terark/sso.hpp"
          test -f "${source_dir}/src/terark/gold_hash_map.hpp"
          test -f "${source_dir}/src/terark/hash_common.cpp"
          test -f "${source_dir}/boost-include/boost/current_function.hpp"

      - name: Download VersityGW
        run: |
          archive=build/e2e/versitygw/versitygw_v1.7.0_Linux_x86_64.tar.gz
          mkdir -p "$(dirname "$archive")"
          curl --fail --location \
            https://github.com/versity/versitygw/releases/download/v1.7.0/versitygw_v1.7.0_Linux_x86_64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            dacec530fecaa8776feec0536998dd4bd78036e0d4db0da9b9189d96bb790e03 \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C build/e2e/versitygw

      - name: Run libfuse functional and stress cases against ngs3fs
        env:
          NGS3FS_STRESS_JOBS: 8
          NGS3FS_STRESS_ITERATIONS: 20
        run: |
          for configuration in legacy:1 uring:1 uring:4 uring-sqpoll:1; do
            engine=${configuration%%:*}
            reactors=${configuration##*:}
            NGS3FS_IO_ENGINE="$engine" NGS3FS_REACTORS="$reactors" \
              ./scripts/test_libfuse_cases.sh \
              "$GITHUB_WORKSPACE/upstream/libfuse" \
              "$GITHUB_WORKSPACE/build/libfuse-cases-$engine-$reactors"
          done

      - name: Run filtered xfstests correctness and stress cases
        env:
          NGS3FS_XFSTESTS_STRESS_JOBS: 8
          NGS3FS_XFSTESTS_STRESS_OPERATIONS: 500
          NGS3FS_RANDOM_READ_FILES: 32
          NGS3FS_RANDOM_READ_THREADS: 16
          NGS3FS_RANDOM_READ_OPERATIONS: 128
          NGS3FS_RANDOM_READ_FILE_SIZE: 4194304
          NGS3FS_RANDOM_READ_MAXIMUM: 262144
        run: |
          sudo env \
            NGS3FS_XFSTESTS_STRESS_JOBS="$NGS3FS_XFSTESTS_STRESS_JOBS" \
            NGS3FS_XFSTESTS_STRESS_OPERATIONS="$NGS3FS_XFSTESTS_STRESS_OPERATIONS" \
            NGS3FS_RANDOM_READ_FILES="$NGS3FS_RANDOM_READ_FILES" \
            NGS3FS_RANDOM_READ_THREADS="$NGS3FS_RANDOM_READ_THREADS" \
            NGS3FS_RANDOM_READ_OPERATIONS="$NGS3FS_RANDOM_READ_OPERATIONS" \
            NGS3FS_RANDOM_READ_FILE_SIZE="$NGS3FS_RANDOM_READ_FILE_SIZE" \
            NGS3FS_RANDOM_READ_MAXIMUM="$NGS3FS_RANDOM_READ_MAXIMUM" \
            ./scripts/test_xfstests.sh \
            "$GITHUB_WORKSPACE/upstream/xfstests" \
            "$GITHUB_WORKSPACE/build/xfstests"

      - name: Run multi-mount race and large-directory test
        env:
          NGS3FS_LARGE_DIRECTORY_ENTRIES: 5000
        run: |
          ./scripts/test_multi_mount.sh \
            "$GITHUB_WORKSPACE/build/multi-mount"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-and-filesystem-test-logs
          if-no-files-found: ignore
          path: |
            build/**/Testing/Temporary/LastTest*.log
            build/libfuse-cases-*/*.log
            build/xfstests/*.log
            build/multi-mount/*.log
            build/read-latency-*/*.log
            build/read-latency-*/README.txt
            build/read-latency-*/results.csv
            build/passthrough/*.log

  hardening:
    name: hardening (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            runner: ubuntu-24.04
            preset: asan
          - name: tsan
            runner: ubuntu-24.04
            preset: tsan
          - name: clang
            runner: ubuntu-24.04
            preset: clang
          - name: arm64
            runner: ubuntu-24.04-arm
            preset: dev
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out ngs3fs
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            fuse3 \
            libfuse3-dev \
            liburing-dev \
            libssl-dev \
            meson \
            ninja-build

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          sudo chmod a+rw /dev/fuse

      - name: Build and test
        env:
          NGS3FS_PRESET: ${{ matrix.preset }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: ./scripts/bootstrap.sh

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out ngs3fs
        uses: actions/checkout@v7

      - name: Check out owner-complete baseline
        uses: actions/checkout@v7
        with:
          ref: 7199db271f1df7e138e401f4adbaf0f423d99eac
          path: build/baseline-src

      - name: Check out FlameGraph
        uses: actions/checkout@v7
        with:
          repository: brendangregg/FlameGraph
          ref: 41fee1f99f9276008b7cd112fca19dc3ea84ac32
          path: build/tools/FlameGraph

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            curl \
            fuse3 \
            libfuse2t64 \
            libfuse3-dev \
            liburing-dev \
            libssl-dev \
            linux-tools-common \
            linux-tools-generic \
            meson \
            ninja-build \
            python3

      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          sudo chmod a+rw /dev/fuse

      - name: Build ngs3fs and download reference binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/bootstrap.sh
          mkdir -p build/tools
          python3 scripts/download_reference_binaries.py \
            build/tools build/tools/reference-binaries.json

      - name: Build owner-complete baseline
        run: |
          test "$(git -C build/baseline-src rev-parse HEAD)" = \
            7199db271f1df7e138e401f4adbaf0f423d99eac
          cmake -S build/baseline-src -B build/baseline -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNGS3FS_BUILD_TESTS=OFF \
            -DNGS3FS_BUILD_BENCHMARKS=OFF \
            -DNGS3FS_DEPS_DIR="$GITHUB_WORKSPACE/.deps" \
            -DTOPLING_ZIP_SOURCE_DIR="$GITHUB_WORKSPACE/build/dev/_deps/ngs3fs_topling_zip-src" \
            -DFETCHCONTENT_SOURCE_DIR_NGS3FS_TINYXML2="$GITHUB_WORKSPACE/build/dev/_deps/ngs3fs_tinyxml2-src" \
            -DFETCHCONTENT_SOURCE_DIR_NGS3FS_XXHASH="$GITHUB_WORKSPACE/build/dev/_deps/ngs3fs_xxhash-src" \
            -DFETCHCONTENT_SOURCE_DIR_NGS3FS_YYJSON="$GITHUB_WORKSPACE/build/dev/_deps/ngs3fs_yyjson-src"
          cmake --build build/baseline --target ngs3fs --parallel 2

      - name: Download VersityGW
        run: |
          archive=build/e2e/versitygw/versitygw_v1.7.0_Linux_x86_64.tar.gz
          mkdir -p "$(dirname "$archive")"
          curl --fail --location \
            https://github.com/versity/versitygw/releases/download/v1.7.0/versitygw_v1.7.0_Linux_x86_64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            dacec530fecaa8776feec0536998dd4bd78036e0d4db0da9b9189d96bb790e03 \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C build/e2e/versitygw

      - name: Enable perf
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          sudo sysctl -w net.core.rmem_max=16777216
          perf --version

      - name: Compare concurrent random reads
        run: |
          for mode in none cold warm; do
            sudo env \
              GOOFYS_BIN="$GITHUB_WORKSPACE/build/tools/goofys" \
              NGS3FS_IO_ENGINE=uring \
              NGS3FS_REACTORS=1 \
              BENCHMARK_REPETITIONS=4 \
              CACHE_MODE="$mode" \
              DROP_CACHES_AFTER_WARMUP=1 \
              ./scripts/benchmark_random_read.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-random-read-$mode"
          done

      - name: A/B test io engines and reactor counts
        run: |
          for advice in random normal; do
            sudo env \
              BENCHMARK_REPETITIONS=5 \
              RANDOM_READ_OPERATIONS=512 \
              RANDOM_READ_ADVICE="$advice" \
              ./scripts/benchmark_io_engine.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-io-engine-$advice"
            printf '\nHeadline CPU and wall-time comparisons use these unsampled A/B runs (512 operations per worker). Separate 4000 Hz profiles identify hotspots; their instrumented CPU and wall times are not headline results.\n' \
              | sudo tee -a "build/benchmarks/github-io-engine-$advice/summary.md" >/dev/null
            printf '\n## I/O engines: %s advice\n\n' "$advice" >> "$GITHUB_STEP_SUMMARY"
            cat "build/benchmarks/github-io-engine-$advice/summary.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: A/B test cached-source owner-ring worker model
        env:
          BENCHMARK_REPETITIONS: 3
          BENCHMARK_VARIANTS: baseline=${{ github.workspace }}/build/baseline/ngs3fs current=${{ github.workspace }}/build/dev/ngs3fs
          BENCHMARK_VARIANT_REVISIONS: baseline=7199db271f1df7e138e401f4adbaf0f423d99eac current=${{ github.sha }}
          BENCHMARK_VARIANT_DESCRIPTIONS: baseline=cached-reply-copy-through-64k current=cached-reply-libfuse-default
          MAX_CONNECTIONS: 8
          NGS3FS_IO_ENGINE: uring
          NGS3FS_REACTORS: 4
          RANDOM_READ_OPERATIONS: 512
        run: |
          for advice in normal random; do
            sudo env \
              BENCHMARK_REPETITIONS="$BENCHMARK_REPETITIONS" \
              BENCHMARK_VARIANTS="$BENCHMARK_VARIANTS" \
              BENCHMARK_VARIANT_REVISIONS="$BENCHMARK_VARIANT_REVISIONS" \
              BENCHMARK_VARIANT_DESCRIPTIONS="$BENCHMARK_VARIANT_DESCRIPTIONS" \
              MAX_CONNECTIONS="$MAX_CONNECTIONS" \
              NGS3FS_IO_ENGINE="$NGS3FS_IO_ENGINE" \
              NGS3FS_REACTORS="$NGS3FS_REACTORS" \
              RANDOM_READ_OPERATIONS="$RANDOM_READ_OPERATIONS" \
              RANDOM_READ_ADVICE="$advice" CACHE_MODE=none \
              ./scripts/benchmark_io_engine.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-io-engine-affinity-$advice"
          done
          for mode in cold warm; do
            sudo env \
              BENCHMARK_REPETITIONS="$BENCHMARK_REPETITIONS" \
              BENCHMARK_VARIANTS="$BENCHMARK_VARIANTS" \
              BENCHMARK_VARIANT_REVISIONS="$BENCHMARK_VARIANT_REVISIONS" \
              BENCHMARK_VARIANT_DESCRIPTIONS="$BENCHMARK_VARIANT_DESCRIPTIONS" \
              MAX_CONNECTIONS="$MAX_CONNECTIONS" \
              NGS3FS_IO_ENGINE="$NGS3FS_IO_ENGINE" \
              NGS3FS_REACTORS="$NGS3FS_REACTORS" \
              RANDOM_READ_OPERATIONS="$RANDOM_READ_OPERATIONS" \
              RANDOM_READ_ADVICE=random CACHE_MODE="$mode" \
              DROP_CACHES_AFTER_WARMUP=1 \
              ./scripts/benchmark_io_engine.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-io-engine-affinity-cache-$mode"
          done

      - name: Profile owner-complete baseline
        if: always()
        run: |
          sudo env \
            NGS3FS_BIN="$GITHUB_WORKSPACE/build/baseline/ngs3fs" \
            NGS3FS_SOURCE_DIR="$GITHUB_WORKSPACE/build/baseline-src" \
            NGS3FS_IO_ENGINE=uring \
            NGS3FS_REACTORS=4 \
            MAX_CONNECTIONS=8 \
            WORKLOAD=random-read \
            RANDOM_READ_OPERATIONS=512 \
            RANDOM_READ_ADVICE=normal \
            CACHE_MODE=none \
            PERF_BIN="$(command -v perf)" \
            PERF_LIB_DIR= \
            PERF_EVENT=cpu-clock \
            PERF_FREQUENCY=4000 \
            PERF_STAT_EVENTS=task-clock,context-switches,cpu-migrations,page-faults \
            PORT=17659 \
            ./scripts/profile_ngs3fs.sh \
            "$GITHUB_WORKSPACE/build/profiles/github-io-engine-affinity-baseline"

      - name: Profile legacy, ordinary uring, and SQPOLL uncached reads
        if: always()
        run: |
          port=17660
          for configuration in legacy:1 uring:1 uring:4 uring-sqpoll:1; do
            engine=${configuration%%:*}
            reactors=${configuration##*:}
            sudo env \
              NGS3FS_IO_ENGINE="$engine" \
              NGS3FS_REACTORS="$reactors" \
              WORKLOAD=random-read \
              RANDOM_READ_OPERATIONS=512 \
              RANDOM_READ_ADVICE=normal \
              CACHE_MODE=none \
              PERF_BIN="$(command -v perf)" \
              PERF_LIB_DIR= \
              PERF_EVENT=cpu-clock \
              PERF_FREQUENCY=4000 \
              PERF_STAT_EVENTS=task-clock,context-switches,cpu-migrations,page-faults \
              PORT="$port" \
              ./scripts/profile_ngs3fs.sh \
              "$GITHUB_WORKSPACE/build/profiles/github-io-engine-$engine-$reactors"
            port=$((port + 1))
          done

      - name: A/B test cached io engines and unlimited passthrough
        run: |
          for mode in cold warm; do
            sudo env CACHE_MODE="$mode" DROP_CACHES_AFTER_WARMUP=1 \
              BENCHMARK_REPETITIONS=3 RANDOM_READ_OPERATIONS=512 \
              ./scripts/benchmark_io_engine.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-io-engine-cache-$mode"
          done
          sudo env CACHE_MODE=warm NGS3FS_CACHE_UNLIMITED=1 \
            DROP_CACHES_AFTER_WARMUP=1 BENCHMARK_REPETITIONS=3 \
            RANDOM_READ_OPERATIONS=512 \
            ./scripts/benchmark_io_engine.sh \
            "$GITHUB_WORKSPACE/build/benchmarks/github-io-engine-cache-unlimited"

      - name: Profile cached block reads on one and four reactors and SQPOLL
        if: always()
        run: |
          port=17670
          for configuration in uring:1 uring:4 uring-sqpoll:1; do
            engine=${configuration%%:*}
            reactors=${configuration##*:}
            for mode in cold warm; do
              drop=0
              if [[ "$mode" == warm ]]; then drop=1; fi
              sudo env NGS3FS_IO_ENGINE="$engine" NGS3FS_REACTORS="$reactors" \
              WORKLOAD=random-read RANDOM_READ_OPERATIONS=512 \
              RANDOM_READ_ADVICE=normal CACHE_MODE="$mode" \
              DROP_CACHES_AFTER_WARMUP="$drop" \
              PERF_BIN="$(command -v perf)" PERF_LIB_DIR= \
              PERF_EVENT=cpu-clock PERF_FREQUENCY=4000 \
              PERF_STAT_EVENTS=task-clock,context-switches,cpu-migrations,page-faults \
              PORT="$port" ./scripts/profile_ngs3fs.sh \
              "$GITHUB_WORKSPACE/build/profiles/github-io-engine-cache-$mode-$engine-$reactors"
              port=$((port + 1))
            done
          done

      - name: Profile cached random-advice reads on legacy, uring, and SQPOLL
        if: always()
        run: |
          port=17665
          for engine in legacy uring uring-sqpoll; do
            sudo env NGS3FS_IO_ENGINE="$engine" NGS3FS_REACTORS=1 \
              WORKLOAD=random-read RANDOM_READ_OPERATIONS=512 \
              RANDOM_READ_ADVICE=random CACHE_MODE=warm \
              DROP_CACHES_AFTER_WARMUP=1 \
              PERF_BIN="$(command -v perf)" PERF_LIB_DIR= \
              PERF_EVENT=cpu-clock PERF_FREQUENCY=4000 \
              PERF_STAT_EVENTS=task-clock,context-switches,cpu-migrations,page-faults \
              PORT="$port" ./scripts/profile_ngs3fs.sh \
              "$GITHUB_WORKSPACE/build/profiles/github-io-engine-cache-random-$engine-1"
            port=$((port + 1))
          done

      - name: Profile cached-source owner-ring worker model
        if: always()
        run: |
          port=17680
          for variant in baseline current; do
            binary="$GITHUB_WORKSPACE/build/dev/ngs3fs"
            source="$GITHUB_WORKSPACE"
            if [[ "$variant" == baseline ]]; then
              binary="$GITHUB_WORKSPACE/build/baseline/ngs3fs"
              source="$GITHUB_WORKSPACE/build/baseline-src"
            fi
            for mode in cold warm; do
              sudo env \
                NGS3FS_BIN="$binary" NGS3FS_SOURCE_DIR="$source" \
                NGS3FS_IO_ENGINE=uring NGS3FS_REACTORS=4 \
                MAX_CONNECTIONS=8 WORKLOAD=random-read \
                RANDOM_READ_OPERATIONS=512 RANDOM_READ_ADVICE=random \
                CACHE_MODE="$mode" DROP_CACHES_AFTER_WARMUP=1 \
                PERF_BIN="$(command -v perf)" PERF_LIB_DIR= \
                PERF_EVENT=cpu-clock PERF_FREQUENCY=4000 \
                PERF_STAT_EVENTS=task-clock,context-switches,cpu-migrations,page-faults \
                PORT="$port" ./scripts/profile_ngs3fs.sh \
                "$GITHUB_WORKSPACE/build/profiles/github-io-engine-affinity-cache-$mode-$variant"
              port=$((port + 1))
            done
          done

      - name: Compare Mountpoint concurrent random reads
        if: always()
        run: |
          for mode in none cold warm; do
            sudo env \
              REFERENCE_CLIENT=mountpoint-s3 \
              MOUNTPOINT_S3_BIN="$GITHUB_WORKSPACE/build/tools/mount-s3" \
              NGS3FS_IO_ENGINE=uring \
              NGS3FS_REACTORS=1 \
              BENCHMARK_REPETITIONS=3 \
              CACHE_MODE="$mode" \
              DROP_CACHES_AFTER_WARMUP=1 \
              ./scripts/benchmark_random_read.sh \
              "$GITHUB_WORKSPACE/build/benchmarks/github-mountpoint-random-read-$mode"
          done

      - name: A/B test socket receive buffer
        if: always()
        run: |
          sudo env \
            BENCHMARK_REPETITIONS=8 \
            SOCKET_BUFFER_SIZES="0 2MiB" \
            ./scripts/benchmark_socket_buffer.sh \
            "$GITHUB_WORKSPACE/build/benchmarks/github-socket-buffer"

      - name: Profile strict random advice
        if: always()
        run: |
          sudo env \
            WORKLOAD=random-read \
            RANDOM_READ_ADVICE=random \
            CACHE_MODE=warm \
            DROP_CACHES_AFTER_WARMUP=1 \
            PERF_BIN="$(command -v perf)" \
            PERF_LIB_DIR= \
            PERF_EVENT=cpu-clock \
            PERF_FREQUENCY=4000 \
            PORT=17650 \
            ./scripts/profile_ngs3fs.sh \
            "$GITHUB_WORKSPACE/build/profiles/github-random-advice"

      - name: Profile normal advice
        if: always()
        run: |
          sudo env \
            WORKLOAD=random-read \
            RANDOM_READ_ADVICE=normal \
            CACHE_MODE=warm \
            DROP_CACHES_AFTER_WARMUP=1 \
            PERF_BIN="$(command -v perf)" \
            PERF_LIB_DIR= \
            PERF_EVENT=cpu-clock \
            PERF_FREQUENCY=4000 \
            PORT=17651 \
            ./scripts/profile_ngs3fs.sh \
            "$GITHUB_WORKSPACE/build/profiles/github-normal-advice"

      - name: Profile cached sequential write
        if: always()
        run: |
          sudo env \
            WORKLOAD=write \
            CACHE_MODE=warm \
            WRITE_BYTES=67108864 \
            WRITE_BLOCK_SIZE=262144 \
            PERF_BIN="$(command -v perf)" \
            PERF_LIB_DIR= \
            PERF_EVENT=cpu-clock \
            PERF_FREQUENCY=4000 \
            PORT=17652 \
            ./scripts/profile_ngs3fs.sh \
            "$GITHUB_WORKSPACE/build/profiles/github-cached-write"

      - name: Benchmark multipart crash recovery
        if: always()
        run: |
          sudo env \
            RECOVERY_BYTES=67108864 \
            RECOVERY_BLOCK_SIZE=262144 \
            RECOVERY_TIMEOUT_SECONDS=60 \
            PORT=17653 \
            ./scripts/benchmark_cache_recovery.sh \
            "$GITHUB_WORKSPACE/build/benchmarks/github-cache-recovery"

      - name: Make Mountpoint evidence readable
        if: always()
        run: |
          for log_root in build/benchmarks/github-mountpoint-random-read-*; do
            if [[ -d "$log_root" ]]; then
              sudo find "$log_root" -path '*/mountpoint-logs/*' -type f \
                -exec chmod a+r {} +
            fi
          done

      - name: Summarize random-read CPU comparisons
        if: always()
        run: |
          sudo install -d -o "$USER" -g "$(id -gn)" \
            build/benchmarks/random-read-report
          cp docs/reactor-batching-results.md \
            build/reactor-batching-results.md
          cp docs/cached-reply-move-results.md \
            build/cached-reply-move-results.md
          cp docs/cached-reply-small-copy-results.md \
            build/cached-reply-small-copy-results.md
          python3 scripts/summarize_io_engine.py \
            build/benchmarks/random-read-report \
            build/benchmarks/github-io-engine-*
          ./scripts/summarize_random_read.py \
            build/benchmarks/random-read-report \
            build/benchmarks/github-random-read-* \
            build/benchmarks/github-mountpoint-random-read-*
          cat build/benchmarks/random-read-report/random-read-cpu-comparison.md \
            >> "$GITHUB_STEP_SUMMARY"
          cat build/benchmarks/random-read-report/owner-complete-comparison.md \
            >> "$GITHUB_STEP_SUMMARY"
          cat build/benchmarks/random-read-report/sqpoll-comparison.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark and flame graphs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: random-read-benchmark-and-flamegraphs
          retention-days: 7
          if-no-files-found: error
          # Keep memory evidence depth-bounded: ** would scan private cache trees.
          path: |
            build/benchmarks/github-random-read-*/*/memory-plan.json
            build/benchmarks/github-random-read-*/*/memory-evidence.json
            build/benchmarks/github-io-engine-*/*/memory-plan.json
            build/benchmarks/github-io-engine-*/*/memory-evidence.json
